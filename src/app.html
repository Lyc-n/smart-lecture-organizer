<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f8fafc" />
		<meta name="description" content="Smart Lecture Organizer. Atur materi belajarmu dengan rapi." />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			(function () {
				var t = localStorage.getItem('slo-theme') || 'light';
				var isLight = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
				if (isLight) document.documentElement.classList.add('light');
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.content = isLight ? '#f8fafc' : '#070b14';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
