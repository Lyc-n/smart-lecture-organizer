<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f8fafc" />
		<meta name="description" content="Smart Lecture Organizer. Atur materi belajarmu dengan rapi." />
		<link rel="manifest" href="/manifest.json" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<script>
			(function () {
				var t = localStorage.getItem('slo-theme') || 'light';
				var isLight = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
				if (isLight) document.documentElement.classList.add('light');
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.content = isLight ? '#f8fafc' : '#020617';
			})();
		</script>
		<style>
			:root {
				--bg-base: #020617; --bg-card: #1e293b; --bg-elevated: #0f172a;
				--text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
				--border: #1e293b;
			}
			.light {
				--bg-base: #f8fafc; --bg-card: #ffffff; --bg-elevated: #f1f5f9;
				--text-primary: #0f172a; --text-secondary: #475569; --text-muted: #94a3b8;
				--border: #e2e8f0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
